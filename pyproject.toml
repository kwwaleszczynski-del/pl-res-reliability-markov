[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-res-reliability-markov"
version = "0.1.0"
description = "Multi-state Markov models of wind and PV availability, sequential Monte Carlo adequacy (LOLE/EENS) and ELCC for Poland on open data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Konrad Waleszczyński" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "requests>=2.31",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pvlib>=0.11",
    "pse-opendata>=0.2,<0.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
res-reliability = "res_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
res_reliability = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
